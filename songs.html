<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody - Songs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="home.html">
            <i class="bi bi-music-note-beamed"></i> Melody
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 ms-auto">
                <a class="nav-link" href="home.html">Home</a>
                <a class="nav-link" href="songs.html">Songs</a>
                <a class="nav-link" href="playlist.html">Playlist</a>
                <a class="nav-link" href="profile.html">Profile</a>
                <input type="text" id="searchInput" class="form-control search" placeholder="Search songs...">
            </div>
        </div>
    </div>
</nav>

<main class="container-fluid pt-5 mt-5">
        <div class="row g-3">
            <div class="col-12 col-md-4 col-lg-3">
                <div class="bg-light bg-opacity-25 rounded-4 p-3 h-100">
                    <h5 class="fw-bold mb-3">Categories</h5>
                    <div class="d-grid gap-2">
                        <button class="btn btn-light text-start category-btn" data-category="Happy">
                            <i class="bi bi-emoji-smile"></i> Happy Songs
                        </button>
                        <button class="btn btn-light text-start category-btn" data-category="Sad">
                            <i class="bi bi-emoji-frown"></i> Sad Songs
                        </button>
                        <button class="btn btn-light text-start category-btn" data-category="Rap">
                            <i class="bi bi-mic"></i> Rap Songs
                        </button>
                        <button class="btn btn-light text-start category-btn" data-category="Motivation">
                            <i class="bi bi-rocket-takeoff"></i> Motivation Songs
                        </button>
                        <button class="btn btn-light text-start category-btn" data-category="English">
                            <i class="bi bi-headphones"></i> English Songs
                        </button>
                        <button class="btn btn-light text-start category-btn" data-category="Telugu">
                            <i class="bi bi-music-note"></i> Telugu Songs
                        </button>
                        <button class="btn btn-light text-start category-btn" data-category="Love">
                            <i class="bi bi-heart"></i> Love Songs
                        </button>
                        <button class="btn btn-light text-start category-btn" data-category="Mass">
                            <i class="bi bi-cup-hot"></i> Mass Songs
                        </button>
                        <button class="btn btn-light text-start category-btn" data-category="Party">
                            <i class="bi bi-stars"></i> Party Songs
                        </button>
                        <button class="btn btn-light text-start category-btn" data-category="Night">
                            <i class="bi bi-moon-stars"></i> Night Songs
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-8 col-lg-9">
                <div class="bg-light bg-opacity-25 rounded-4 p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <h3 id="categoryTitle" class="fw-bold mb-1">Happy Songs</h3>
                            <small id="categoryText">Feel good songs for your mood.</small>
                        </div>
                        <span class="badge bg-light text-dark" id="songCount">0 Songs</span>
                    </div>
                    <div id="songsBox" class="d-grid gap-2"></div>
                </div>
            </div>
        </div>
    </main>
    <audio id="audioPlayer"></audio>
    <script src="songs.js"></script>
</body>
</html>
