<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody - Playlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid px-3 px-md-4">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="bi bi-music-note-beamed"></i> Melody
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 ms-auto">
                    <a class="nav-link" href="home.html">Home</a>
                    <a class="nav-link" href="songs.html">Songs</a>
                    <a class="nav-link" href="playlist.html">Playlist</a>
                    <a class="nav-link" href="profile.html">Profile</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="container-fluid pt-5 mt-4 px-3 px-md-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="text-center mb-4">
                    <h1 class="fw-bold">
                        <i class="bi bi-heart-fill"></i> My Playlist
                    </h1>
                    <p class="fs-5 mb-0">Your favourite songs</p>
                </div>
                <div class="song-item d-flex align-items-center justify-content-between rounded-4 p-3 mb-3">
                    <div class="d-flex align-items-center gap-3">
                        <div>
                            <h4 class="mb-1">
                                <i class="bi bi-music-note-list"></i> Favourite Songs
                            </h4>
                            <span id="song-count">0 songs</span>
                        </div>
                    </div>
                    <button id="play-all" class="play-btn rounded-circle p-2">
                        <i class="bi bi-play-fill fs-4"></i>
                    </button>
                </div>
                <div id="playlist-box"></div>
                <div id="empty-playlist" class="text-center mt-5 d-none">
                    <i class="bi bi-heart fs-1"></i>
                    <h3 class="mt-3">Your playlist is empty</h3>
                    <p>Add your favourite songs from the Songs page.</p>
                    <a href="songs.html" class="btn btn-light">
                        <i class="bi bi-music-note-list"></i> Go to Songs
                    </a>
                </div>
            </div>
        </div>
    </main>
    <audio id="audioPlayer"></audio>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="playlist.js"></script>
</body>
</html>
