<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody - Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="bi bi-music-note-beamed"></i> Melody
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 ms-auto">
                    <a class="nav-link" href="home.html">Home</a>
                    <a class="nav-link" href="songs.html">Songs</a>
                    <a class="nav-link" href="playlist.html">Playlist</a>
                    <a class="nav-link" href="profile.html">Profile</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="container-fluid pt-5 mt-4">
        <div class="row justify-content-end">
            <div class="col-12 col-md-6 col-lg-4 me-lg-4">
                <div class="song-item d-flex align-items-center rounded-4 p-2 mb-3">
                    <i class="bi bi-person-circle fs-2 me-3"></i>
                    <div>
                        <h5 class="mb-1" id="profileName">My Profile</h5>
                        <span id="profileDetails">Login to add your details</span>
                    </div>
                    <button class="btn pink-btn ms-auto rounded-pill" id="loginButton" data-bs-toggle="modal" data-bs-target="#profileModal">
                        Login
                    </button>
                    <button class="btn pink-btn ms-auto rounded-pill d-none" id="logoutButton">
                        Logout
                    </button>
                </div>
                <div class="song-item d-flex align-items-center rounded-4 p-2 mb-3">
                    <i class="bi bi-music-note-list fs-4 me-3"></i>
                    <div>
                        <h5 class="mb-1">My Playlist</h5>
                        <span id="playlistCount">0 songs</span>
                    </div>
                    <a href="playlist.html" class="text-dark ms-auto">
                        <i class="bi bi-chevron-right fs-4"></i>
                    </a>
                </div>
                <div class="song-item d-flex align-items-start rounded-4 p-3 mb-3">
                    <i class="bi bi-clock-history fs-4 me-3 mt-1"></i>
                    <div class="flex-grow-1">
                        <h5 class="mb-1">Recently Played</h5>
                        <div id="recentSongs" class="mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="modal fade" id="profileModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="profileForm">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="nameInput" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="emailInput" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <input type="tel" class="form-control" id="mobileInput" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 rounded-pill">
                            Save
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="profile.js"></script>
</body>
</html>
